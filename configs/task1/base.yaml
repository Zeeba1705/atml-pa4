#task 1 compression (handout pp.2-5). #ours = our choice, see docs/decisions.md

model: Qwen/Qwen2.5-1.5B
dtype: float16

#p.3 eligible projections; embeddings, norms, biases, lm_head untouched; tied params counted once
eligible_projections: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

data:   #relative to --data_root (default: data_repo in shared.yaml)
  calibration: data/public_locked/c4_calibration_locked.jsonl.gz
  development: data/public_locked/c4_development_locked.jsonl.gz
  wikitext2: data/public_locked/wikitext2_test_windows_locked.jsonl.gz
  c4_val: data/public_locked/c4_validation_windows_locked.jsonl.gz
  hellaswag: data/public_locked/hellaswag_val_locked.jsonl.gz

calibration_sequences: 128      #p.3
development_sequences: 32       #p.3, only for allocation hyperparameters
sequence_length: 512
calibration_mode: sequential    #ours (decision 1.5): inputs from already-compressed earlier blocks, as wanda/awq reference code

ppl_scored_tokens: 50000        #p.3, per suite, asserted identical across conditions

hellaswag:
  n_full: 2000                  #p.3
  n_diagnostic: 512             #p.3, first 512 ids
  task_version: lm-eval hellaswag 1.0   #ours, preprocessing copied from lm-eval (attributed)
  acc_norm: characters          #p.3, not tokens
  #p.3 + decision 1.1: these get the full 2000, everything else the first 512
  full_conditions:
    - baseline
    - p1_magnitude_s0.5
    - p2_wanda_s0.5
    - p3_nonuniform_s0.5
    - q1_uniform_b4
    - q1_uniform_b3
    - q2_awq_b4
    - q2_awq_b3
    - q3_mixed_budget_b4
    - q3_mixed_budget_b3

pruning:
  p1_sparsities: [0.25, 0.5, 0.75]   #p.4
  p2_sparsities: [0.25, 0.5, 0.75]   #p.4
  p3_sparsities: [0.5, 0.75]         #p.4
  p3_min_unit_sparsity: 0.10         #p.4
  p3_max_unit_sparsity: 0.85         #p.4
  mask: per_output_row               #p.2/p.4
  exact_zero_count: true             #decision 1.6, largest-remainder rounding, asserted
  two_four: {n: 2, m: 4, sparsity: 0.5}   #p.4 step 8, along contiguous input channels
  #decision 1.7 (student choice): projection units, rank-linear rule s = target + lam*(1 - 2 rank/(U-1)), lam on dev only
  p3_unit: projection
  p3_lambda_grid: [0.0, 0.05, 0.1, 0.15, 0.2]   #ours; 0.0 = p2, kept as the dev reference

#decision 1.7: one gradient pass over the 128 calibration sequences (p3 taylor, q3 fisher)
sensitivity:
  loss_scale: 1024     #ours, fp16 backward; halved automatically on overflow (count recorded)

quantization:
  q_bits: [8, 4, 3]                  #p.4 q1/q2
  q3_allowed_bits: [2, 3, 4, 8]      #p.4
  q3_budgets_from: [q2_awq_b4, q2_awq_b3]   #p.4, packed bytes incl metadata and uncompressed params
  q3_unit: projection                #decision 1.7; exact ilp (scipy milp) on fisher sensitivities under the byte budget
  #q2 uniform packed totals measured on gpu (results/task1/q2_awq_b*/resources.json, commit 215d0a1); bytes only, asserted
  q3_expected_budget_bytes: {4: 1147810816, 3: 982756864}
  group_size: 128                    #p.4, along input columns
  symmetric: false                   #p.2 asymmetric
  range: minmax                      #decision 1.3, no clipping search for q1/q2/q3
  rounding: round_half_even          #torch.round
  scale_dtype: float16               #decision 1.2
  zero_point: integer_packed_b_bits  #decision 1.2, z clamped to [0, 2^b-1]
  packing: lsb_first_bitstream_row_major_byte_padded_per_tensor
  awq_alpha_grid: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]   #ours, p.4 "small recorded grid"
  #decision 1.4: folds that are algebraically valid; o_proj input scales are not foldable under gqa -> stored fp16, bytes counted
  awq_folds:
    input_layernorm: [q_proj, k_proj, v_proj]
    post_attention_layernorm: [gate_proj, up_proj]
    up_proj: [down_proj]
  awq_unfolded_fp16_scales: [o_proj]

sparse_storage_estimate:   #p.4
  mask_bits_per_eligible_weight: 1
  value_bits_per_nonzero: 16
  byte_aligned: true

resources:   #p.4
  prefill_lengths: [512, 2048]
  decode_tokens: 64
  batch_size: 1                #ours
  warmup_reps: 2               #ours
  timing_reps: 5               #p.4 at least five
  latency_prompt: first tokens of concatenated c4_val windows   #ours, timing only

bootstrap_resamples: 2000      #ours, p.5 paired 95% intervals
